{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="site-nav-bar" aria-label="Primary">
        <ul class="site-nav-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="site-nav-links__item {% if page.url == link.url or (link.url != '/' and page.url contains link.url) %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
          <li class="site-nav-links__item theme-choice-item" data-theme-choice-item="auto"><a href="#" class="theme-choice-link" data-theme-choice="auto">Auto</a></li>
          <li class="site-nav-links__item theme-choice-item" data-theme-choice-item="dawn"><a href="#" class="theme-choice-link" data-theme-choice="dawn">Dawn</a></li>
          <li class="site-nav-links__item theme-choice-item" data-theme-choice-item="day"><a href="#" class="theme-choice-link" data-theme-choice="day">Day</a></li>
          <li class="site-nav-links__item theme-choice-item" data-theme-choice-item="dusk"><a href="#" class="theme-choice-link" data-theme-choice="dusk">Dusk</a></li>
          <li class="site-nav-links__item theme-choice-item" data-theme-choice-item="night"><a href="#" class="theme-choice-link" data-theme-choice="night">Night</a></li>
        </ul>
      </nav>
    </div>
  </div>
</div>
