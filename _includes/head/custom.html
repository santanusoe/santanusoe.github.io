<meta name="theme-color" content="#fafaf8"/>

<script>
  (() => {
    const THEME_STORAGE_KEY = 'theme-preference';
    const validThemes = ['auto', 'dawn', 'day', 'dusk', 'night'];
    const themeColors = {
      dawn: '#fbf2e8',
      day: '#fafaf8',
      dusk: '#1b2231',
      night: '#0f151a'
    };

    const getAutoTheme = () => {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 8) return 'dawn';
      if (hour >= 8 && hour < 17) return 'day';
      if (hour >= 17 && hour < 20) return 'dusk';
      return 'night';
    };

    let preference = 'auto';
    try {
      const savedPreference = window.localStorage.getItem(THEME_STORAGE_KEY);
      if (savedPreference && validThemes.includes(savedPreference)) {
        preference = savedPreference;
      }
    } catch (_) {}

    const resolvedTheme = preference === 'auto' ? getAutoTheme() : preference;
    const root = document.documentElement;
    root.dataset.themePreference = preference;
    root.dataset.theme = resolvedTheme;

    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) {
      metaTheme.setAttribute('content', themeColors[resolvedTheme] || themeColors.day);
    }
  })();
</script>
