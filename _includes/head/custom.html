{% include base_path %}

<!-- start custom head snippets -->

<link rel="preload" href="{{ base_path }}/assets/css/academicons.css" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<style>
  .js body {
    opacity: 0;
  }

  .js body.page-ready {
    opacity: 1;
    transition: opacity 0.22s ease;
  }

  .page,
  .masthead,
  .page__footer {
    transition: opacity 0.24s ease, transform 0.24s ease;
  }

  body.page-leaving .page {
    opacity: 0;
    transform: translateY(10px);
  }

  body.page-leaving .masthead,
  body.page-leaving .page__footer {
    opacity: 0.96;
  }

  .site-nav-links__item a {
    transform: translateY(0);
    transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }

  .site-nav-links__item a:hover,
  .site-nav-links__item a:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
  }

  @media (prefers-reduced-motion: reduce) {
    .js body,
    .js body.page-ready,
    .page,
    .masthead,
    .page__footer,
    .site-nav-links__item a {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
      box-shadow: none !important;
    }
  }
</style>

<!-- end custom head snippets -->
