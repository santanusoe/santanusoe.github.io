{% include base_path %}

{% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}

<li class="talk-cv-item">
  <strong>
    <a href="{{ base_path }}{{ post.url }}" rel="permalink">{{ title }}</a>
  </strong><br />
  <span>
    {% if post.date %}{{ post.date | date: '%b %Y' }}{% endif %}{% if post.venue %} · {{ post.venue }}{% endif %}{% if post.location %}, {{ post.location }}{% endif %}
  </span>
</li>
