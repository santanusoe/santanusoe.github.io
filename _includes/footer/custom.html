<script>
  (() => {
    const THEME_STORAGE_KEY = 'theme-preference';
    const themeIcons = {
      auto: 'fa-circle-half-stroke',
      dawn: 'fa-sun',
      day: 'fa-sun',
      dusk: 'fa-cloud-sun',
      night: 'fa-moon'
    };
    const themeColors = {
      dawn: '#fbf2e8',
      day: '#fafaf8',
      dusk: '#1b2231',
      night: '#0f151a'
    };
    const validThemes = ['auto', 'dawn', 'day', 'dusk', 'night'];
    const root = document.documentElement;
    const themeSelect = document.getElementById('theme-select');
    const themeIcon = document.getElementById('theme-icon');
    const prefetched = new Set();

    const getAutoTheme = () => {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 8) return 'dawn';
      if (hour >= 8 && hour < 17) return 'day';
      if (hour >= 17 && hour < 20) return 'dusk';
      return 'night';
    };

    const resolveTheme = (preference) => preference === 'auto' ? getAutoTheme() : preference;

    const updateThemeMeta = (theme) => {
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', themeColors[theme] || themeColors.day);
      }
    };

    const updateThemeUI = (preference) => {
      if (themeSelect) {
        themeSelect.value = preference;
      }
      if (themeIcon) {
        themeIcon.className = 'fa-solid ' + (themeIcons[preference] || themeIcons.auto);
      }
    };

    const applyTheme = (preference, persist = true) => {
      const normalizedPreference = validThemes.includes(preference) ? preference : 'auto';
      const resolvedTheme = resolveTheme(normalizedPreference);
      root.dataset.themePreference = normalizedPreference;
      root.dataset.theme = resolvedTheme;
      updateThemeMeta(resolvedTheme);
      updateThemeUI(normalizedPreference);
      if (persist) {
        try {
          window.localStorage.setItem(THEME_STORAGE_KEY, normalizedPreference);
        } catch (_) {}
      }
    };

    const readPreference = () => {
      const current = root.dataset.themePreference;
      if (current && validThemes.includes(current)) return current;
      try {
        const savedPreference = window.localStorage.getItem(THEME_STORAGE_KEY);
        if (savedPreference && validThemes.includes(savedPreference)) return savedPreference;
      } catch (_) {}
      return 'auto';
    };

    const isInternalNavigation = (url) =>
      url.origin === window.location.origin &&
      !url.hash &&
      !url.href.startsWith('mailto:') &&
      !url.href.startsWith('tel:');

    const prefetchPage = (href) => {
      if (!href || prefetched.has(href)) return;
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = href;
      document.head.appendChild(link);
      prefetched.add(href);
    };

    const queuePrefetch = (anchor) => {
      if (!anchor) return;
      try {
        const url = new URL(anchor.href, window.location.href);
        if (!isInternalNavigation(url)) return;
        if (url.pathname === window.location.pathname && url.search === window.location.search) return;
        prefetchPage(url.href);
      } catch (_) {}
    };

    applyTheme(readPreference(), false);

    if (themeSelect) {
      themeSelect.addEventListener('change', (event) => {
        applyTheme(event.target.value || 'auto');
      });
    }

    window.setInterval(() => {
      if (readPreference() === 'auto') {
        applyTheme('auto', false);
      }
    }, 60000);

    document.addEventListener('mouseover', (event) => queuePrefetch(event.target.closest('a[href]')), { passive: true });
    document.addEventListener('touchstart', (event) => queuePrefetch(event.target.closest('a[href]')), { passive: true });
    document.addEventListener('focusin', (event) => queuePrefetch(event.target.closest('a[href]')));
  })();
</script>
