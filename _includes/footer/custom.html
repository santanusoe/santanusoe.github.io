<script>
  (() => {
    const THEME_STORAGE_KEY = 'theme-preference';
    const validThemes = ['day', 'night'];
    const themeIcons = {
      day: 'fa-sun',
      night: 'fa-moon'
    };
    const themeColors = {
      day: '#fafaf8',
      night: '#0f151a'
    };

    const root = document.documentElement;
    const themeButton = document.querySelector('.theme-switcher__button');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');
    const prefetched = new Set();

    const updateThemeMeta = (theme) => {
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', themeColors[theme] || themeColors.day);
      }
    };

    const updateThemeButton = (theme) => {
      if (!themeButton || !themeIcon || !themeLabel) return;
      themeIcon.className = 'fa-solid ' + (themeIcons[theme] || themeIcons.day);
      themeLabel.textContent = theme === 'night' ? 'Night' : 'Day';
      const nextTheme = theme === 'night' ? 'day' : 'night';
      const label = 'Theme: ' + (theme === 'night' ? 'Night' : 'Day') + '. Click to change to ' + (nextTheme === 'night' ? 'Night' : 'Day');
      themeButton.setAttribute('aria-label', label);
      themeButton.setAttribute('title', label);
    };

    const applyTheme = (theme, persist = true) => {
      const normalizedTheme = validThemes.includes(theme) ? theme : 'day';
      root.dataset.themePreference = normalizedTheme;
      root.dataset.theme = normalizedTheme;
      updateThemeMeta(normalizedTheme);
      updateThemeButton(normalizedTheme);
      if (persist) {
        try {
          window.localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
        } catch (_) {}
      }
    };

    const readTheme = () => {
      const current = root.dataset.themePreference;
      if (current && validThemes.includes(current)) return current;
      try {
        const savedTheme = window.localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme && validThemes.includes(savedTheme)) return savedTheme;
      } catch (_) {}
      return 'day';
    };

    if (themeButton) {
      themeButton.addEventListener('click', () => {
        const current = readTheme();
        applyTheme(current === 'night' ? 'day' : 'night');
      });
    }

    applyTheme(readTheme(), false);

    const isInternalNavigation = (url) =>
      url.origin === window.location.origin &&
      !url.hash &&
      !url.href.startsWith('mailto:') &&
      !url.href.startsWith('tel:');

    const prefetchPage = (href) => {
      if (!href || prefetched.has(href)) return;
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = href;
      document.head.appendChild(link);
      prefetched.add(href);
    };

    const queuePrefetch = (anchor) => {
      if (!anchor) return;
      try {
        const url = new URL(anchor.href, window.location.href);
        if (!isInternalNavigation(url)) return;
        if (url.pathname === window.location.pathname && url.search === window.location.search) return;
        prefetchPage(url.href);
      } catch (_) {}
    };

    document.addEventListener('mouseover', (event) => queuePrefetch(event.target.closest('a[href]')), { passive: true });
    document.addEventListener('touchstart', (event) => queuePrefetch(event.target.closest('a[href]')), { passive: true });
    document.addEventListener('focusin', (event) => queuePrefetch(event.target.closest('a[href]')));
  })();
</script>
